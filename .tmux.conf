# ~/.tmux.conf (tmux 3.5). Reload: tmux source-file ~/.tmux.conf
# Prefix stays the default Ctrl+B.

# ── Basics ───────────────────────────────────────────────────────────────────
set -g mouse on
set -g history-limit 2000000
set -g escape-time 0
set -g cursor-style bar
# Pass window focus changes to programs inside tmux (e.g. Claude Code knows when the terminal
# is in the background)
set -g focus-events on
# Ghostty runs as xterm-256color: tell tmux it does 24-bit colour, or every colour inside tmux
# is rounded to the 256-colour palette
set -as terminal-features ',xterm*:RGB'

# ── Panes and windows (no prefix) ────────────────────────────────────────────
bind -n C-S-d split-window -h          # Ctrl+Shift+D: split right
bind -n C-S-f split-window -v          # Ctrl+Shift+F: split below
bind -n C-S-n new-window               # Ctrl+Shift+N: new window
bind -n M-k   kill-pane                # Alt+K: close pane

bind -n C-S-Left  select-pane -L       # Ctrl+Shift+arrows: move between panes
bind -n C-S-Right select-pane -R
bind -n C-S-Up    select-pane -U
bind -n C-S-Down  select-pane -D

bind -n M-S-Up    resize-pane -U 5     # Alt+Shift+arrows: resize pane
bind -n M-S-Down  resize-pane -D 5
bind -n M-S-Left  resize-pane -L 5
bind -n M-S-Right resize-pane -R 5

bind -n M-Left  previous-window        # Alt+Left/Right: previous/next window
bind -n M-Right next-window
bind . command-prompt "rename-window '%%'"   # Prefix + .: rename window

# The first window of a new session is called "main"
set-hook -g after-new-session 'run-shell "tmux rename-window -t \"#{session_name}:0.0\" main"'

# ── Scrolling and search ─────────────────────────────────────────────────────
bind -n C-PageUp   copy-mode -e \; send-keys -X page-up
bind -n C-PageDown copy-mode -e \; send-keys -X page-down
bind -n S-PageUp   copy-mode -e \; send-keys -X history-top
bind -n S-PageDown copy-mode -e \; send-keys -X history-bottom \; send-keys -X cancel
bind -n S-Up       copy-mode -e \; send-keys -X scroll-up
bind -n S-Down     copy-mode -e \; send-keys -X scroll-down

# Ctrl+F: search the pane's whole history while typing, every match highlighted.
# Enter = stay on the match, n / N = next / previous match, Esc or q = leave.
# Ctrl+F, every pane: search the pane's whole history in a popup (query bar on top, matching lines,
# scrollable preview; Esc closes). In a pane running Claude Code it searches the whole chat, which
# Claude's fullscreen view keeps out of tmux's history. Script: ~/.config/tmux/history-search.
# run-shell expands the formats, so the popup gets this pane's id and this client.
bind -n C-f run-shell -b "tmux display-popup -c '#{client_name}' -t '#{pane_id}' -E -w 90% -h 90% -T ' search ' \"~/.config/tmux/history-search '#{pane_id}'\""
# Prefix + [ then C-r / C-s: tmux's own search, inside the pane
# n = next match above, N = next match below, always (tmux's own n/N follow the last direction, so
# after one N the next n stood still). A backward search leaves the cursor at the start of a match,
# a forward one at its end, so N steps one cell, searches forward, then back onto that match's start:
# every n and N then starts from a match start.
bind -T copy-mode n send-keys -FX search-backward-text '#{pane_search_string}'
bind -T copy-mode N {
  send-keys -X cursor-right
  send-keys -FX search-forward-text '#{pane_search_string}'
  send-keys -FX search-backward-text '#{pane_search_string}'
}

# ── Look: Catppuccin Macchiato ───────────────────────────────────────────────
set -g status-style 'bg=#1e2030,fg=#a5adcb'
set -g status-left '#[fg=#24273a,bg=#c6a0f6,bold] #S #[default] '
set -g status-left-length 20
set -g status-right '#[fg=#8087a2]#{=50:pane_title} '
set -g status-right-length 70
set -g window-status-format ' #I:#W '
set -g window-status-current-format '#[fg=#24273a,bg=#8aadf4,bold] #I:#W '
set -g window-status-separator ''
set -g pane-border-style 'fg=#363a4f'
set -g pane-active-border-style 'fg=#c6a0f6'
set -g message-style 'bg=#363a4f,fg=#cad3f5'
set -g mode-style 'bg=#494d64,fg=#cad3f5'
set -g copy-mode-match-style 'bg=#494d64,fg=#cad3f5'
set -g copy-mode-current-match-style 'bg=#f5a97f,fg=#24273a'
set -g popup-border-style 'fg=#c6a0f6'
set -g popup-border-lines rounded
